# =============================================
#  SehatKu Platform — Application Properties
# =============================================

# ----- Server -----
server.port=8080

# ----- MySQL Database -----
# Ganti username/password sesuai MySQL kalian
spring.datasource.url=jdbc:mysql://localhost:3306/healthplatform?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----- Gemini API -----
# Isi dengan API key dari Google AI Studio
gemini.api.key=GANTI_DENGAN_API_KEY_KAMU
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# ----- Thymeleaf -----
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ----- Logging -----
logging.level.alp.semester2.tugas=DEBUG
logging.level.org.springframework.security=INFO
